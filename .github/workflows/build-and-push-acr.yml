name: Build & Push Devcontainer Base to ACR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  # Placeholder values. Update when you wire secrets.
  IMAGE_NAME: devcontainer-base-fedora

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compute Docker tags for the ACR image.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to ACR (placeholder secrets)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image (push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USERNAME=developer
            USER_UID=1000
            USER_GID=1000
            # Placeholder: set these secrets to your dotfiles repo when ready.
            DOTFILES_REPO=${{ secrets.DOTFILES_REPO }}
            DOTFILES_REV=${{ secrets.DOTFILES_REV || 'master' }}
            DOTFILES_NVIM_PATH=${{ secrets.DOTFILES_NVIM_PATH || '' }}
            REQUIRE_DOTFILES_CONFIG=${{ secrets.REQUIRE_DOTFILES_CONFIG || 'false' }}

      - name: Smoke test pulled image
        run: |
          set -euo pipefail

          # Use the SHA tag as the smoke target.
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "Pulling $IMAGE"
          docker pull "$IMAGE"

          echo "Running smoke check"
          docker run --rm \
            -e TERM=xterm-256color \
            "$IMAGE" \
            /bin/bash -lc "bash /workspaces/smoke-check.sh || true"
