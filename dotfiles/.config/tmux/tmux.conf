##### Prefix ###############################################################
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

##### General ##############################################################
set -g base-index 1
setw -g pane-base-index 1

set -g history-limit 100000
set -g mouse on

set -g escape-time 0

set -g renumber-windows on

set -g set-clipboard on

##### Vim Keys #############################################################
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix + Ctrl-h/j/k/l to resize panes
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

##### Splits ###############################################################
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

##### Windows ##############################################################
bind c new-window -c "#{pane_current_path}"

bind -r n next-window
bind -r p previous-window

bind Tab last-window

##### Pane ###############################################################
# Prefix + t: rename current pane (sets pane title)
bind t command-prompt -p "Rename pane to: " "select-pane -T '%%'"

##### Copy Mode ############################################################
bind Enter copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

##### Reload ###############################################################
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

##### Status Bar ###########################################################
set -g status-position top
# Keep the status bar at the very top.
# Use a slightly taller bar to create a tiny visual padding under it.
set -g status-height 2

# Tokyonight theme (palettes based on Tokyonight colors)
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#9ece6a]#S "
# No date/time on the status bar
set -g status-right "#[fg=#7aa2f7]%H "

set -g window-status-format "#[fg=#7aa2f7] #I:#W "
set -g window-status-current-format "#[fg=#c0caf5,bg=#36465d,bold] #I:#W "

##### Quality of Life ######################################################
bind x kill-pane
bind X kill-window

bind z resize-pane -Z

bind q display-panes
